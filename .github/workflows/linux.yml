name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2

      # Protocol and offline paths first: this is the fastest signal and does
      # not need audio or a display.
      - name: Offline build and tests
        run: |
          cargo test --no-default-features
          cargo build --release --no-default-features

      # The full editor: audio (ALSA), HID (hidraw) and the window stack.
      - name: Editor build and tests
        run: |
          cargo test
          cargo build --release
