[package]
name = "scx2"
version = "0.1.0"
edition = "2021"
description = "Open-source preset editor / librarian for the Fender Super Champ X2"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "scx2"
path = "src/lib.rs"

[[bin]]
name = "scx2"
path = "src/main.rs"
