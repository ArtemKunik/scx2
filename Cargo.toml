[package]
name = "scx2"
version = "0.2.0"
edition = "2021"
description = "Open-source preset editor / librarian for the Fender Super Champ X2"
license = "MIT"

[features]
default = ["ui"]
ui = ["dep:eframe", "dep:rfd", "tuner", "midi"]
tuner = ["dep:cpal", "dep:windows", "dep:hound"]
midi = ["dep:midir"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = { version = "0.15.3", optional = true }
eframe = { version = "0.27", optional = true }
hound = { version = "3.5", optional = true }
midir = { version = "0.10", optional = true }
rfd = { version = "0.17", optional = true }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows builds use the in-tree hidapi C backend (setupapi), which needs no
# extra system packages.
[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = "2"

# Linux hidapi's default backend needs libudev headers. The pure-Rust
# `basic-udev` backend reads sysfs directly, so a plain `cargo build` works on
# any distribution without `libudev-dev`.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", optional = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
] }

[lib]
name = "scx2"
path = "src/lib.rs"

[[bin]]
name = "scx2"
path = "src/main.rs"
