# Linux build and test. The repository's origin is Azure DevOps, so this is
# the CI definition to register as a pipeline; .github/workflows/linux.yml is
# kept for a GitHub mirror.
trigger:
  branches:
    include:
      - main
pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 1

  - script: |
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        pkg-config libasound2-dev \
        libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
    displayName: Install system dependencies

  - script: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal
      echo "##vso[task.prependpath]$HOME/.cargo/bin"
    displayName: Install Rust

  # Protocol and offline paths first: fastest signal, no audio or display.
  - script: |
      cargo test --no-default-features
      cargo build --release --no-default-features
    displayName: Offline tests and build

  # The full editor: audio (ALSA), HID (hidraw) and the window stack.
  - script: |
      cargo test
      cargo build --release
    displayName: Editor tests and build
